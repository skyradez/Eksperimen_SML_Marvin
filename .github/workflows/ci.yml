name: MLflow CI - Retrain & Build Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: file:${{ github.workspace }}/SMSML_Marvin/Workflow-CI/MLProject/mlruns
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model

jobs:
  retrain-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: SMSML_Marvin/Workflow-CI/MLProject

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mlflow==2.21.3 \
            scikit-learn==1.7.2 \
            pandas==2.3.3 \
            numpy==2.2.6 \
            matplotlib==3.9.2 \
            joblib==1.4.2

      - name: Show project structure
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f

      - name: Run MLflow Project
        run: |
          mlflow run . \
            --env-manager local \
            -P n_estimators=300 \
            -P max_depth=12

          echo "Checking MLflow output..."
          ls -la
          find . -maxdepth 3 -type d

      - name: Read run_id
        id: runid
        run: |
          if [ ! -f run_id.txt ]; then
            echo "run_id.txt not found"
            exit 1
          fi

          echo "run_id=$(cat run_id.txt)" >> $GITHUB_OUTPUT
          echo "Run ID:"
          cat run_id.txt

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            mlruns/**
            artifacts/**
            run_id.txt
          if-no-files-found: ignore

      - name: Commit artifacts back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add mlruns artifacts run_id.txt || true

          git commit -m "CI: retrain model [skip ci]" || echo "Nothing to commit"

          git push || echo "Nothing to push"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          mlflow models build-docker \
            --model-uri "runs:/${{ steps.runid.outputs.run_id }}/model" \
            --name "${{ env.DOCKER_IMAGE }}" \
            --env-manager local

      - name: Push Docker image
        run: |
          docker tag "${{ env.DOCKER_IMAGE }}" "${{ env.DOCKER_IMAGE }}:latest"
          docker push "${{ env.DOCKER_IMAGE }}:latest"
