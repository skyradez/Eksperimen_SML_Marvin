name: Automated Data Preprocessing

# Advance (4 pts): jalankan preprocessing setiap kali ada trigger dan
# kembalikan dataset terbaru yang sudah diproses sebagai artefak.
on:
  push:
    branches: [ main ]
    paths:
      - "telco_churn_raw/**"
      - "preprocessing/**"
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Run automated preprocessing
        working-directory: preprocessing
        run: |
          python automate_Marvin.py \
            --input ../telco_churn_raw/telco_churn_raw.csv \
            --output telco_churn_preprocessing

      - name: Commit refreshed processed dataset
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/telco_churn_preprocessing/*
          git commit -m "CI: refresh preprocessed Telco churn dataset [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Upload processed dataset as artifact
        uses: actions/upload-artifact@v4
        with:
          name: telco_churn_preprocessing
          path: preprocessing/telco_churn_preprocessing/
