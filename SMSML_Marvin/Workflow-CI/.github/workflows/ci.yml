name: MLflow CI - Retrain & Build Docker

# Advance (4 pts):
#  - Retrain otomatis via MLflow Project ketika trigger dipantik
#  - Simpan artefak model ke repositori (GitHub artifact + commit)
#  - Build Docker image dari model dan push ke Docker Hub (mlflow build-docker)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: file:./mlruns
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model

jobs:
  retrain-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MLProject

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.7.2 pandas==2.3.3 numpy==2.2.6 matplotlib==3.9.2 joblib==1.4.2

      # ---- Retrain via MLflow Project ----
      - name: Run MLflow Project (retrain)
        run: |
          mlflow run . --env-manager local \
            -P n_estimators=300 -P max_depth=12

      - name: Resolve latest run id
        id: runid
        run: echo "run_id=$(cat run_id.txt)" >> "$GITHUB_OUTPUT"

      # ---- Skilled: simpan artefak ke repositori (GitHub) ----
      - name: Upload model artifacts (GitHub artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model
          path: |
            MLProject/mlruns/**
            MLProject/artifacts/**

      - name: Commit artifacts back to repo
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f mlruns artifacts run_id.txt
          git commit -m "CI: retrain model & store artifacts [skip ci]" || echo "No changes"
          git push || echo "Nothing to push"

      # ---- Advance: build & push Docker image ----
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build MLflow model Docker image
        run: |
          mlflow models build-docker \
            --model-uri "runs:/${{ steps.runid.outputs.run_id }}/model" \
            --name "$DOCKER_IMAGE"

      - name: Push image to Docker Hub
        run: |
          docker tag "$DOCKER_IMAGE" "$DOCKER_IMAGE:latest"
          docker push "$DOCKER_IMAGE:latest"
