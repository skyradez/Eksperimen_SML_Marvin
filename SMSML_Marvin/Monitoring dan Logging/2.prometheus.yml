# prometheus.yml - Kriteria 4
# Scrape metrik dari exporter model (3.prometheus_exporter.py) di port 8000.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # (opsional) isi dengan alamat Alertmanager

scrape_configs:
  - job_name: "telco_churn_model_exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          service: "telco-churn-model"
          env: "local"

  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]
